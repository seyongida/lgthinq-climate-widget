name: Distribute iOS build with Firebase
# Builds an Ad Hoc IPA for the devices in IOS_ADHOC_DEVICES and sends it to Firebase App Distribution testers.
# The IPA embeds those UDIDs, so it is only ever shared through Firebase, never published on GitHub.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ios-adhoc
  cancel-in-progress: false
jobs:
  distribute:
    runs-on: macos-26
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.thinqclimate.widget' }}
      IOS_APP_GROUP: ${{ vars.IOS_APP_GROUP || 'group.dev.thinqclimate.widget' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_ADHOC_DEVICES: ${{ secrets.IOS_ADHOC_DEVICES }}
      IOS_DISTRIBUTION_CERT_ID: ${{ secrets.IOS_DISTRIBUTION_CERT_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS || 'friends' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        run: |
          for name in IOS_ADHOC_DEVICES IOS_DISTRIBUTION_CERT_ID FIREBASE_SERVICE_ACCOUNT_BASE64 FIREBASE_IOS_APP_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::$name is not configured. See docs/DISTRIBUTION.md."; exit 1; fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Swift core
        run: swift test --package-path ios
      - name: Build Ad Hoc IPA
        run: bash scripts/build-adhoc.sh dist
      - name: Upload to Firebase App Distribution
        run: |
          key="$RUNNER_TEMP/firebase.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' ios/project.yml)
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx -y firebase-tools@14.27.0 appdistribution:distribute dist/ThinQClimate.ipa \
            --app "$FIREBASE_IOS_APP_ID" --groups "$FIREBASE_GROUPS" \
            --release-notes "Climate Widget $version ($GITHUB_RUN_NUMBER). 등록한 iPhone에서만 설치할 수 있어요."
