name: Publish iOS Ad Hoc install
# Devices come from the IOS_ADHOC_DEVICES secret. Ad Hoc IPAs embed their device list,
# so this public release exposes those UDIDs to anyone who inspects the file.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ios-adhoc
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.thinqclimate.widget' }}
      IOS_APP_GROUP: ${{ vars.IOS_APP_GROUP || 'group.dev.thinqclimate.widget' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_ADHOC_DEVICES: ${{ secrets.IOS_ADHOC_DEVICES }}
      IOS_DISTRIBUTION_CERT_ID: ${{ secrets.IOS_DISTRIBUTION_CERT_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Swift core
        run: swift test --package-path ios
      - name: Build Ad Hoc IPA
        run: bash scripts/build-adhoc.sh dist
      # --latest=false keeps the public Android download link on the APK release.
      - name: Publish release
        run: |
          gh release create "adhoc-$GITHUB_RUN_NUMBER" dist/ThinQClimate.ipa dist/manifest.plist \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "iOS Ad Hoc $GITHUB_RUN_NUMBER" --notes "Installs only on registered devices."
      - name: Update install page
        run: gh workflow run pages.yml --ref main
