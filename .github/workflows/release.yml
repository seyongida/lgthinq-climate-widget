name: Publish Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before publishing')
          key = Path(os.environ['RUNNER_TEMP']) / 'thinq-release.jks'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          PY
      - name: Test and build public APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/thinq-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          THINQ_PAT: ''
        run: ./gradlew :core:check :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify credentials, version and signature
        run: |
          python3 scripts/verify-release.py android/app/build/outputs/apk/release/app-release.apk --version "$GITHUB_REF_NAME"
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > release-assets/SIGNING_CERTIFICATE.txt
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/ThinQ-Climate.apk
          cd release-assets
          sha256sum ThinQ-Climate.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-android-release
          path: release-assets/*
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/thinq-release.jks"
  publish:
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IOS_TESTFLIGHT_URL: ${{ vars.IOS_TESTFLIGHT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: public-android-release
          path: release-assets
      - name: Prepare download instructions
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-assets/INSTALL.md
      - name: Publish downloads
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Climate Widget $GITHUB_REF_NAME" --notes-file release-assets/INSTALL.md
  ios-firebase:
    if: vars.FIREBASE_IOS_APP_ID != ''
    needs: publish
    uses: ./.github/workflows/ios-adhoc.yml
    secrets: inherit
  ios:
    if: vars.IOS_TESTFLIGHT_ENABLED == 'true'
    needs: publish
    uses: ./.github/workflows/ios-testflight.yml
    with:
      build_number: ${{ vars.IOS_BUILD_NUMBER || '' }}
    secrets: inherit
