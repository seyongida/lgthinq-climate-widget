name: Publish Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Restore distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before publishing')
          key = Path(os.environ['RUNNER_TEMP']) / 'thinq-release.jks'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          PY
      - name: Test and build public APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/thinq-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          THINQ_PAT: ''
        run: ./gradlew :core:check :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --console=plain
      - name: Verify credentials, version and signature
        run: |
          python3 scripts/verify-release.py android/app/build/outputs/apk/release/app-release.apk --version "$GITHUB_REF_NAME"
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > release-assets/SIGNING_CERTIFICATE.txt
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/ThinQ-Climate.apk
          cd release-assets
          sha256sum ThinQ-Climate.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-android-release
          path: release-assets/*
          retention-days: 14
      # The Play bundle is uploaded to Google Play only, not attached to the public release.
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/thinq-release.jks"
  publish:
    # With Google Play on, the GitHub download is the APK Google signs with the Play app signing key, so an
    # app installed from GitHub and one installed from Play are the same app and update each other.
    needs: [android, play]
    if: always() && needs.android.result == 'success' && (needs.play.result == 'success' || needs.play.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IOS_TESTFLIGHT_URL: ${{ vars.IOS_TESTFLIGHT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: public-android-release
          path: release-assets
      - uses: actions/download-artifact@v4
        if: needs.play.result == 'success'
        with:
          name: play-signed-apk
          path: play-signed
      - name: Use the Google-signed APK
        if: needs.play.result == 'success'
        run: |
          cp play-signed/ThinQ-Climate.apk release-assets/ThinQ-Climate.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-assets/ThinQ-Climate.apk > release-assets/SIGNING_CERTIFICATE.txt
          (cd release-assets && sha256sum ThinQ-Climate.apk > SHA256SUMS)
      - name: Prepare download instructions
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-assets/INSTALL.md
      - name: Publish downloads
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Climate Widget $GITHUB_REF_NAME" --notes-file release-assets/INSTALL.md
  ios-firebase:
    if: vars.FIREBASE_IOS_APP_ID != ''
    needs: publish
    uses: ./.github/workflows/ios-adhoc.yml
    secrets: inherit
  ios:
    if: vars.IOS_TESTFLIGHT_ENABLED == 'true'
    needs: publish
    uses: ./.github/workflows/ios-testflight.yml
    with:
      build_number: ${{ vars.IOS_BUILD_NUMBER || '' }}
      notes: ${{ format('Climate Widget {0} 새 버전입니다.', github.ref_name) }}
    secrets: inherit
  appstore:
    # After the build is processed and on TestFlight, submit the same build for App Store review.
    if: vars.APPSTORE_ENABLED == 'true'
    needs: ios
    uses: ./.github/workflows/appstore.yml
    with:
      build_number: ${{ needs.ios.outputs.build_number }}
      notes: ${{ format('Climate Widget {0} 업데이트입니다.', github.ref_name) }}
    secrets: inherit
  play:
    # Google Play testing track (closed testing by default); turn on with PLAY_ENABLED=true.
    if: vars.PLAY_ENABLED == 'true'
    needs: android
    runs-on: ubuntu-24.04
    env:
      PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: play-bundle
          path: play-bundle
      - name: Upload to Google Play
        run: python3 scripts/play.py upload play-bundle/app-release.aab --notes "Climate Widget $GITHUB_REF_NAME"
      - name: Download the APK Google signed
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          mkdir -p play-signed
          python3 scripts/play.py universal-apk "$code" play-signed/ThinQ-Climate.apk
          # Built by Google from the bundle the android job verified; check it is that version of this app.
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging play-signed/ThinQ-Climate.apk | head -1)
          echo "$badging"
          grep -q "name='dev.thinqclimate.widget.release' versionCode='$code' versionName='${GITHUB_REF_NAME#v}'" <<<"$badging"
      - uses: actions/upload-artifact@v4
        with:
          name: play-signed-apk
          path: play-signed/ThinQ-Climate.apk
          retention-days: 14
