name: Update Google Play listing
# Pushes the texts and images in play/ to the Google Play store listing.
# "prepare" enables the Play Developer API and checks that Play Console access was granted.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [listing, prepare, signed-apk, tracks]
        default: listing
      version_code:
        description: 'For signed-apk: the version code to download'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  listing:
    runs-on: ubuntu-24.04
    env:
      PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Run
        if: inputs.mode != 'signed-apk'
        run: python3 scripts/play.py "${{ inputs.mode || 'listing' }}"
      - name: Download the Google-signed APK
        if: inputs.mode == 'signed-apk'
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 scripts/play.py universal-apk "$VERSION_CODE" ThinQ-Climate.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ThinQ-Climate.apk | grep -E "SHA-256|DN"
