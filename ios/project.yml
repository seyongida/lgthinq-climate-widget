name: ThinQClimate
options:
  bundleIdPrefix: dev.thinqclimate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "5"
    MARKETING_VERSION: "1.3.0"
    CLIMATE_BUNDLE_ID: dev.thinqclimate.widget
    CLIMATE_APP_GROUP: group.dev.thinqclimate.widget
    CLIMATE_KEYCHAIN_GROUP: $(AppIdentifierPrefix)dev.thinqclimate.shared
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ThinQClimate:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ThinQClimateWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLIMATE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ThinQ Climate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CLIMATE_APP_PROFILE)
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ClimateAppGroup: $(CLIMATE_APP_GROUP)
        ClimateKeychainGroup: $(CLIMATE_KEYCHAIN_GROUP)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [thinqclimate]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(CLIMATE_APP_GROUP)]
        keychain-access-groups: [$(CLIMATE_KEYCHAIN_GROUP)]
  ThinQClimateWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLIMATE_BUNDLE_ID).extension
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CLIMATE_WIDGET_PROFILE)
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: ThinQ Climate
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ClimateAppGroup: $(CLIMATE_APP_GROUP)
        ClimateKeychainGroup: $(CLIMATE_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(CLIMATE_APP_GROUP)]
        keychain-access-groups: [$(CLIMATE_KEYCHAIN_GROUP)]
schemes:
  ThinQClimate:
    build:
      targets:
        ThinQClimate: all
